# 独立实验链：通过算法版本提案发布交易内计价参数。
local:
  nodeCount: 1
  outputDir: ../output/network/local-1node-pricing
  httpPortBase: 8761
  signerAccount: signer
  extraArgs: [--cache, "128"]
  expose:
    - node: node1
      httpHostPort: 8761
network:
  name: cryptoupgrade-pricing
  chainId: 11223345
  networkId: 11223345
  gasLimit: 30000000
  peerTopology: full
consensus:
  type: clique
  period: 0
  epoch: 30000
docker:
  image: cryptoupgrade-geth:lab
  networkName: cryptoupgrade-pricing
  cpus: "0.50"
  memory: 768m
cryptoupgrade:
  enabled: true
  smokeTest: false
  addSource: ../algorithm/go/wasm/add.wasm
  # 计价参数通过 upload-wasm -pricing 随算法版本提交。
accounts:
  signer:
    address: 0xF5F871aA6Bd253914705898c66251f994aa426FA
    privateKey: ./signer.key
    password: "123456"
    balance: "30000000000000000000000"
