# 独立实验链：在创世配置冻结交易内递增费率，未设置父区块负载项。
local:
  nodeCount: 1
  outputDir: ../output/network/local-1node-pricing
  httpPortBase: 8761
  signerAccount: signer
  extraArgs: [--cache, "128"]
  expose:
    - node: node1
      httpHostPort: 8761
network:
  name: cryptoupgrade-pricing
  chainId: 11223345
  networkId: 11223345
  gasLimit: 30000000
  peerTopology: full
consensus:
  type: clique
  period: 0
  epoch: 30000
docker:
  image: cryptoupgrade-geth:lab
  networkName: cryptoupgrade-pricing
  cpus: "0.50"
  memory: 768m
cryptoupgrade:
  enabled: true
  smokeTest: false
  addSource: ../algorithm/go/wasm/add.wasm
  pricing:
    activationBlock: 1
    profile:
      threshold: 2
      alpha: {numerator: 1, denominator: 2}
      algorithms:
        - name: Pbkdf2Sha256
          version: 1
          metric: encodedInputBytes
          bands:
            - {maxMetric: 18446744073709551615, gas: 3000}
      load:
        - maxCalls: 18446744073709551615
          multiplier: {numerator: 1, denominator: 1}
accounts:
  signer:
    address: 0xF5F871aA6Bd253914705898c66251f994aa426FA
    privateKey: ./signer.key
    password: "123456"
    balance: "30000000000000000000000"
