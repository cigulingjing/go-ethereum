network:
  name: cryptoupgrade-local10
  chainId: 11223344
  networkId: 11223344
  gasLimit: 8000000

consensus:
  type: clique
  period: 5
  epoch: 30000
  signers:
    - 0xF5F871aA6Bd253914705898c66251f994aa426FA

docker:
  image: cryptoupgrade-geth:lab
  networkName: cryptoupgrade-local10

cryptoupgrade:
  enabled: true
  smokeTest: false
  addSource: ../../../../cryptoupgrade/algorithm/wasm/add.wasm

accounts:
  signer:
    address: 0xF5F871aA6Bd253914705898c66251f994aa426FA
    keystore: ./keystore/node1
    password: ./passwords/node1.txt
    balance: "30000000000000000000000"

nodes:
