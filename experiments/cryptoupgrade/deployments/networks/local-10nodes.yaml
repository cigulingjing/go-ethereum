    host: node1
    advertiseHost: node1
    p2pPort: 30303
    p2pHostPort: 30401
    httpPort: 8545
    httpHostPort: 8761
    datadir: ./data/node1
    pluginDir: ./plugin/node1
    nodeKey: ./keys/node1.key
