network:
  name: cryptoupgrade-local
  chainId: 11223344
  networkId: 11223344
  gasLimit: 8000000

consensus:
  type: clique
  period: 5
  epoch: 30000
  signers:
    - 0xF5F871aA6Bd253914705898c66251f994aa426FA

docker:
  image: cryptoupgrade-geth:lab
  networkName: cryptoupgrade-local

cryptoupgrade:
  enabled: true
  # smokeTest 会利用 addSource 给定的 .wasm 文件实现升级。
  smokeTest: true
  addSource: ../../../../cryptoupgrade/algorithm/wasm/add.wasm

accounts:
  signer:
    address: 0xF5F871aA6Bd253914705898c66251f994aa426FA
    keystore: ./keystore/node1
    password: ./passwords/node1.txt
    balance: "30000000000000000000000"

nodes:
  - id: node1
    role: signer
    host: node1
    advertiseHost: node1
    p2pPort: 30303
    p2pHostPort: 30303
    httpPort: 8545
    httpHostPort: 8661
    datadir: ./data/node1
    pluginDir: ./plugin/node1
    nodeKey: ./keys/node1.key
    account: signer

  - id: node2
    role: observer
    host: node2
    advertiseHost: node2
    p2pPort: 30303
    p2pHostPort: 30304
    httpPort: 8545
    httpHostPort: 8662
    datadir: ./data/node2
    pluginDir: ./plugin/node2
    nodeKey: ./keys/node2.key
